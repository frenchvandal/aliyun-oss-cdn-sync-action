name: Commit via GitHub API
description: >-
  Commit every change in the working tree to a branch through the
  `createCommitOnBranch` GraphQL mutation. Commits land as `Verified`
  because GitHub signs them server-side.

inputs:
  headline:
    description: Commit subject line.
    required: true
  body:
    description: Commit body (optional).
    required: false
    default: ""
  branch:
    description: Target branch name.
    required: false
    default: ${{ github.ref_name }}
  token:
    description: Token used to authenticate the API call.
    required: false
    default: ${{ github.token }}

outputs:
  committed:
    description: "`true` when a commit was created, `false` otherwise."
    value: ${{ steps.commit.outputs.committed }}
  oid:
    description: The new commit OID when one was created.
    value: ${{ steps.commit.outputs.oid }}

runs:
  using: composite
  steps:
    - id: commit
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        HEADLINE: ${{ inputs.headline }}
        BODY: ${{ inputs.body }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail

        changes="$(git status --porcelain=v1 --untracked-files=all)"
        if [[ -z "${changes}" ]]; then
          echo "committed=false" >> "${GITHUB_OUTPUT}"
          echo "No working-tree changes to commit."
          exit 0
        fi

        additions_file="$(mktemp)"
        deletions_file="$(mktemp)"
        printf '[]\n' > "${additions_file}"
        printf '[]\n' > "${deletions_file}"

        cleanup() {
          rm -f "${additions_file}" "${deletions_file}" \
            "${additions_file}.tmp" "${deletions_file}.tmp" "${payload_file:-}"
        }
        trap cleanup EXIT

        while IFS= read -r line; do
          [[ -z "${line}" ]] && continue
          status="${line:0:2}"
          path="${line:3}"

          if [[ "${status}" == R* || "${status}" == *R ]]; then
            old="${path%% -> *}"
            new="${path##* -> }"
            jq --arg p "${old}" '. + [{path:$p}]' "${deletions_file}" > "${deletions_file}.tmp"
            mv "${deletions_file}.tmp" "${deletions_file}"
            contents="$(base64 -w0 "${new}")"
            jq --arg p "${new}" --arg c "${contents}" \
              '. + [{path:$p, contents:$c}]' "${additions_file}" > "${additions_file}.tmp"
            mv "${additions_file}.tmp" "${additions_file}"
            continue
          fi

          if [[ "${status}" == "D "* || "${status}" == " D"* ]]; then
            jq --arg p "${path}" '. + [{path:$p}]' "${deletions_file}" > "${deletions_file}.tmp"
            mv "${deletions_file}.tmp" "${deletions_file}"
            continue
          fi

          contents="$(base64 -w0 "${path}")"
          jq --arg p "${path}" --arg c "${contents}" \
            '. + [{path:$p, contents:$c}]' "${additions_file}" > "${additions_file}.tmp"
          mv "${additions_file}.tmp" "${additions_file}"
        done <<< "${changes}"

        expected_oid="$(git rev-parse HEAD)"

        query='mutation(
          $repo: String!,
          $branch: String!,
          $headline: String!,
          $body: String!,
          $expectedHeadOid: GitObjectID!,
          $additions: [FileAddition!],
          $deletions: [FileDeletion!]
        ) {
          createCommitOnBranch(input: {
            branch: { repositoryNameWithOwner: $repo, branchName: $branch },
            message: { headline: $headline, body: $body },
            fileChanges: { additions: $additions, deletions: $deletions },
            expectedHeadOid: $expectedHeadOid
          }) {
            commit { oid }
          }
        }'

        payload_file="$(mktemp)"

        jq -n \
          --arg q "${query}" \
          --arg repo "${GITHUB_REPOSITORY}" \
          --arg branch "${BRANCH}" \
          --arg headline "${HEADLINE}" \
          --arg body "${BODY}" \
          --arg oid "${expected_oid}" \
          --slurpfile additions "${additions_file}" \
          --slurpfile deletions "${deletions_file}" \
          '{
            query: $q,
            variables: {
              repo: $repo,
              branch: $branch,
              headline: $headline,
              body: $body,
              expectedHeadOid: $oid,
              additions: $additions[0],
              deletions: $deletions[0]
            }
          }' > "${payload_file}"

        response="$(gh api --method POST /graphql --input "${payload_file}")"
        oid="$(jq -r '.data.createCommitOnBranch.commit.oid' <<<"${response}")"

        if [[ -z "${oid}" || "${oid}" == "null" ]]; then
          echo "createCommitOnBranch did not return a commit OID:" >&2
          jq . <<<"${response}" >&2
          exit 1
        fi

        echo "committed=true" >> "${GITHUB_OUTPUT}"
        echo "oid=${oid}" >> "${GITHUB_OUTPUT}"
        echo "Created verified commit ${oid} on ${BRANCH}."
