name: Update Dependencies

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dependencies-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions
          cache: true

      - name: Snapshot current dependency specifiers
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail

          snapshot_file="$(mktemp)"
          jq -S '.imports' deno.json > "${snapshot_file}"
          echo "file=${snapshot_file}" >> "${GITHUB_OUTPUT}"

      - name: Run dependency updates
        id: update_deps
        shell: bash
        env:
          BEFORE_SNAPSHOT: ${{ steps.snapshot.outputs.file }}
        run: |
          set -euo pipefail

          rm -f deno.lock
          deno task update-deps

          working_tree_status="$(git status --short)"
          if [[ -z "${working_tree_status}" ]]; then
            echo "updated=false" >> "${GITHUB_OUTPUT}"
            echo "No dependency updates were detected." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          after_snapshot="$(jq -S '.imports' deno.json)"
          before_snapshot="$(cat "${BEFORE_SNAPSHOT}")"

          changes_json="$(jq -n \
            --argjson before "${before_snapshot}" \
            --argjson after "${after_snapshot}" \
            '
              ([$before, $after] | map(keys) | add | unique) as $keys
              | $keys
                | map({
                    alias: .,
                    before: ($before[.] // null),
                    after: ($after[.] // null)
                  })
                | map(select(.before != .after))
            ')"

          changes_md="$(jq -r '
            if length == 0 then
              "_No specifier changes; only `deno.lock` was regenerated._"
            else
              map(
                if .before == null then "- Added `\(.alias)`: `\(.after)`"
                elif .after == null then "- Removed `\(.alias)` (was `\(.before)`)"
                else "- `\(.alias)`: `\(.before)` -> `\(.after)`"
                end
              ) | join("\n")
            end
          ' <<<"${changes_json}")"

          changes_plain="$(jq -r '
            if length == 0 then
              "No specifier changes; only deno.lock was regenerated."
            else
              map(
                if .before == null then "- Added \(.alias): \(.after)"
                elif .after == null then "- Removed \(.alias) (was \(.before))"
                else "- \(.alias): \(.before) -> \(.after)"
                end
              ) | join("\n")
            end
          ' <<<"${changes_json}")"

          echo "updated=true" >> "${GITHUB_OUTPUT}"
          {
            echo "changes_plain<<COMMIT_BODY_EOF"
            printf '%s\n' "${changes_plain}"
            echo "COMMIT_BODY_EOF"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Dependency updates"
            echo
            printf '%s\n' "${changes_md}"
            echo
            echo "### Working-tree changes"
            echo
            echo '```text'
            printf '%s\n' "${working_tree_status}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Stop when dependencies are already up to date
        if: steps.update_deps.outputs.updated != 'true'
        run: echo "No dependency updates were detected."

      - name: Build project artifacts
        if: steps.update_deps.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail

          deno task build
          deno fmt dist/

      - name: Guard against unexpected working-tree changes
        if: steps.update_deps.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail

          unexpected_changes="$(
            git status --short |
              awk '{
                path = substr($0, 4)
                if (path != "deno.json" && path != "deno.lock" && path !~ /^dist\//) {
                  print
                }
              }'
          )"
          if [[ -n "${unexpected_changes}" ]]; then
            echo "Unexpected files changed after updating dependencies:"
            printf '%s\n' "${unexpected_changes}"
            exit 1
          fi

      - name: Validate commit message
        if: steps.update_deps.outputs.updated == 'true'
        shell: bash
        env:
          COMMIT_HEADLINE: "build(deps): update dependencies"
          COMMIT_BODY: ${{ steps.update_deps.outputs.changes_plain }}
        run: |
          set -euo pipefail

          commit_message_file="$(mktemp)"
          {
            printf '%s\n\n' "${COMMIT_HEADLINE}"
            printf '%s\n' "${COMMIT_BODY}"
          } > "${commit_message_file}"
          deno task lint-commit "${commit_message_file}"

      - name: Commit and push via GitHub API
        if: steps.update_deps.outputs.updated == 'true'
        uses: ./.github/actions/commit-via-api
        with:
          headline: "build(deps): update dependencies"
          body: ${{ steps.update_deps.outputs.changes_plain }}
